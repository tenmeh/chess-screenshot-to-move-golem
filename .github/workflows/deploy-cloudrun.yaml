# Build the container and deploy it to Cloud Run.
#
# Runs only after R-CMD-check succeeds on main, so a red build is never
# deployed. Can also be triggered by hand from the Actions tab.
#
# Required repository configuration (see README "Deployment"):
#   secrets.GCP_WORKLOAD_IDENTITY_PROVIDER  - workload identity provider
#   secrets.GCP_SERVICE_ACCOUNT             - deploying service account email
#   vars.GCP_PROJECT_ID                     - GCP project id
#   vars.GCP_REGION                         - a free-tier region, e.g. us-central1

name: deploy-cloudrun

on:
  workflow_run:
    workflows: ["R-CMD-check"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  SERVICE: chessvision
  REPOSITORY: chessvision

permissions:
  contents: read
  id-token: write # required for keyless auth to Google Cloud

jobs:
  deploy:
    # Only deploy a commit whose checks actually passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Keyless: no long-lived JSON key is stored in the repository.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPOSITORY}/${SERVICE}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Shiny-specific settings that matter here:
      #   concurrency 10 - one R process is single-threaded, so a high
      #     concurrency would queue users behind each other
      #   timeout 3600   - Shiny holds a websocket open for the whole session
      #   cpu-boost      - shortens the cold start, which matters when the
      #     container also has to start a chess engine
      #   memory 2Gi     - R + magick + V8 + Stockfish, with headroom for the
      #     neural-net engine coming in the next phase
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --concurrency 10 \
            --timeout 3600 \
            --min-instances 0 \
            --max-instances 3 \
            --session-affinity \
            --cpu-boost \
            --port 8080

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE}" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format 'value(status.url)'
