on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # renv is used for local development only; CI resolves dependencies from
      # DESCRIPTION so a stale lockfile can't wedge the build.
      RENV_CONFIG_AUTOLOADER_ENABLED: FALSE

    steps:
      - uses: actions/checkout@v4

      # magick needs ImageMagick++ and V8 needs libnode; the SVG delegate
      # (librsvg) is what rasterizes the piece art, so recognition depends on it.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmagick++-dev \
            librsvg2-dev \
            libnode-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # The app downloads Stockfish and piece art on first use, which CI
          # neither needs nor should depend on, so notes are not errors here.
          error-on: '"error"'
          upload-snapshots: true
